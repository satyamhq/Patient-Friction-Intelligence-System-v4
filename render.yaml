services:
  # ===================================================
  # 1. PFIS Backend Web Service (Render Node.js Service)
  # ===================================================
  - type: web
    name: pfis-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://pfis-patient-friction-intelligence.onrender.com
      - key: SERVER_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com/api/auth/google/callback
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ELEVENLABS_AGENT_ID
        value: agent_2901m2hw983kfcesprd47f904gbk
      - key: MAX_FILE_SIZE_MB
        value: "10"

  # ===================================================
  # 2. PFIS Frontend Static Site (Render Static Site)
  # ===================================================
  - type: web
    name: pfis-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pfis-patient-friction-intelligence-system.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

